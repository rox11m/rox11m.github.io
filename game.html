<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; overflow: hidden; background: #222; }
    canvas { display: block; }
    #gameover-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: Arial, sans-serif;
      cursor: pointer;
      z-index: 10;
    }
    h1 { margin: 0 0 20px 0; font-size: 48px; text-transform: uppercase; }
    p { margin: 0; font-size: 24px; color: #aaa; }
    #kill-counter {
      position: fixed;
      top: 15px;
      left: 20px;
      color: #fff;
      font-family: 'Arial', sans-serif;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      z-index: 5;
      pointer-events: none;
    }
    #hp-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 20px;
      background: #333;
      border: 2px solid #000;
      border-radius: 10px;
      z-index: 5;
      pointer-events: none;
    }
    #hp-fill {
      width: 100%;
      height: 100%;
      background: #4caf50;
      border-radius: 8px;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="kill-counter">Убито: 0 | Волна: 1 | Зомби: 4 | Оружие: Пистолет</div>
  <div id="hp-container">
    <div id="hp-fill"></div>
  </div>
  <div id="gameover-screen">
    <h1>GAME OVER</h1>
    <p>Нажмите в любом месте, чтобы начать заново</p>
  </div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const goScreen = document.getElementById('gameover-screen');
    const killCounterDiv = document.getElementById('kill-counter');
    const hpFillDiv = document.getElementById('hp-fill');

    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const WORLD_WIDTH = 2400;
    const WORLD_HEIGHT = 1800;

    const S = 40;
    const SPEED = 3.8;
    const ACCELERATION = 0.3;
    const FRICTION = 0.8;
    const BULLET_SPEED = 12;
    const FIRE_RATE_PISTOL = 300;
    const FIRE_RATE_SHOTGUN = 900;
    const ZOMBIE_HP = 3;
    const PLAYER_MAX_HP = 100;
    const ZOMBIE_DAMAGE = 50;
    const SHOTGUN_KILLS_REQUIRED = 20;
    const STRONG_ZOMBIE_KILLS_REQUIRED = 30;

    let x, y;
    let velX = 0, velY = 0;
    let keys;
    let trees;
    let zombies;
    let bullets;
    let particles;
    let lastShot;
    let gameActive = false;
    let killCount = 0;
    let lastSpawnedCorner = -1;
    let playerHp = PLAYER_MAX_HP;
    let lastHitTime = 0;
    const HIT_COOLDOWN = 500;

    let gunDirection = { dx: 1, dy: 0 };
    let camera = { x: 0, y: 0 };

    let legAnimPhase = 0;
    let isMoving = false;
    let zombieAnimPhase = 0;

    let maxZombies = 4;
    let currentWave = 1;
    const KILLS_PER_LEVEL = 5;
    let currentWeapon = 'pistol';
    let baseZombieSpeed = 1.0;

    function initGame() {
      x = WORLD_WIDTH / 2 - S / 2;
      y = WORLD_HEIGHT / 2 - S;
      velX = 0;
      velY = 0;

      killCount = 0;
      currentWave = 1;
      maxZombies = 4;
      baseZombieSpeed = 1.0;
      currentWeapon = 'pistol';
      updateKillCounterDisplay();
      lastSpawnedCorner = -1;
      gunDirection = { dx: 1, dy: 0 };
      playerHp = PLAYER_MAX_HP;
      updateHpDisplay();
      lastHitTime = 0;
      zombieAnimPhase = 0;

      keys = {
        ArrowLeft: 0, ArrowRight: 0,
        ArrowUp: 0, ArrowDown: 0,
        KeyW: 0, KeyA: 0, KeyS: 0, KeyD: 0
      };

      trees = [];
      const MIN_TREE_DIST = 250;
      const TREE_SIZE = 60;
      const NUM_TREES = 20;

      for (let i = 0; i < NUM_TREES; i++) {
        let attempts = 0;
        let placed = false;
        while (!placed && attempts < 500) {
          const tx = Math.random() * (WORLD_WIDTH - TREE_SIZE);
          const ty = Math.random() * (WORLD_HEIGHT - TREE_SIZE);
          const centerX = tx + TREE_SIZE / 2;
          const centerY = ty + TREE_SIZE / 2;

          let tooClose = false;
          for (const t of trees) {
            const otherCenterX = t.x + TREE_SIZE / 2;
            const otherCenterY = t.y + TREE_SIZE / 2;
            const dist = Math.hypot(centerX - otherCenterX, centerY - otherCenterY);
            if (dist < MIN_TREE_DIST) {
              tooClose = true;
              break;
            }
          }

          const playerDist = Math.hypot(centerX - WORLD_WIDTH/2, centerY - WORLD_HEIGHT/2);
          if (!tooClose && playerDist > 200) {
            trees.push({ x: tx, y: ty, w: TREE_SIZE, h: TREE_SIZE });
            placed = true;
          }
          attempts++;
        }
        if (!placed) {
          const tx = Math.random() * (WORLD_WIDTH - TREE_SIZE);
          const ty = Math.random() * (WORLD_HEIGHT - TREE_SIZE);
          trees.push({ x: tx, y: ty, w: TREE_SIZE, h: TREE_SIZE });
        }
      }

      zombies = [];
      bullets = [];
      particles = [];
      lastShot = { ArrowUp: 0, ArrowDown: 0, ArrowLeft: 0, ArrowRight: 0 };
      gameActive = true;
      goScreen.style.display = 'none';
      loop();
    }

    function updateKillCounterDisplay() {
      const weaponName = currentWeapon === 'pistol' ? 'Пистолет' : 'Дробовик';
      killCounterDiv.textContent = `Убито: ${killCount} | Волна: ${currentWave} | Зомби: ${maxZombies} | Оружие: ${weaponName}`;
    }

    function updateHpDisplay() {
      const percent = Math.max(0, (playerHp / PLAYER_MAX_HP) * 100);
      hpFillDiv.style.width = percent + '%';
      if (percent > 60) hpFillDiv.style.background = '#4caf50';
      else if (percent > 30) hpFillDiv.style.background = '#ff9800';
      else hpFillDiv.style.background = '#f44336';
    }

    window.onkeydown = e => {
      if (!gameActive) return;
      if (keys.hasOwnProperty(e.code)) keys[e.code] = 1;
      if (e.code === 'ArrowUp') gunDirection = { dx: 0, dy: -1 };
      if (e.code === 'ArrowDown') gunDirection = { dx: 0, dy: 1 };
      if (e.code === 'ArrowLeft') gunDirection = { dx: -1, dy: 0 };
      if (e.code === 'ArrowRight') gunDirection = { dx: 1, dy: 0 };
    };
    window.onkeyup = e => {
      if (!gameActive) return;
      if (keys.hasOwnProperty(e.code)) keys[e.code] = 0;
    };

    function rectCollide(r1, r2) {
      return !(
        r1.x + r1.w <= r2.x ||
        r2.x + r2.w <= r1.x ||
        r1.y + r1.h <= r2.y ||
        r2.y + r2.h <= r1.y
      );
    }

    function collidesWithTrees(x, y, w, h) {
      const rect = { x, y, w, h };
      for (const t of trees) {
        if (rectCollide(rect, t)) {
          return true;
        }
      }
      return false;
    }

    function collidesWithOtherZombies(me, x, y, w, h) {
      const rect = { x, y, w, h };
      for (const z of zombies) {
        if (z === me || z.dead) continue;
        const zRect = { x: z.x, y: z.y, w: z.w, h: z.h };
        if (rectCollide(rect, zRect)) {
          return true;
        }
      }
      return false;
    }

    function spawnParticles(px, py) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: px,
          y: py,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 2,
          life: 30 + Math.random() * 30,
          size: 3 + Math.random() * 4,
          color: Math.random() > 0.5 ? '#8b0000' : '#ff0000'
        });
      }
    }

    function spawnZombie() {
      const corners = [
        { cornerX: 60, cornerY: 60 },
        { cornerX: WORLD_WIDTH - 100, cornerY: 60 },
        { cornerX: 60, cornerY: WORLD_HEIGHT - 130 },
        { cornerX: WORLD_WIDTH - 100, cornerY: WORLD_HEIGHT - 130 }
      ];

      if (lastSpawnedCorner === -1) {
        lastSpawnedCorner = Math.floor(Math.random() * corners.length);
      } else {
        let newCorner;
        do {
          newCorner = Math.floor(Math.random() * corners.length);
        } while (newCorner === lastSpawnedCorner);
        lastSpawnedCorner = newCorner;
      }

      const corner = corners[lastSpawnedCorner];
      const jitter = 60;
      let zx, zy;
      let attempts = 0;
      let found = false;

      while (!found && attempts < 50) {
        zx = Math.max(0, Math.min(WORLD_WIDTH - 40, corner.cornerX + (Math.random() * jitter - jitter/2)));
        zy = Math.max(0, Math.min(WORLD_HEIGHT - 72, corner.cornerY + (Math.random() * jitter - jitter/2)));
        if (!collidesWithTrees(zx, zy, 40, 72) && !collidesWithOtherZombies(null, zx, zy, 40, 72)) {
          found = true;
        }
        attempts++;
      }

      if (!found) {
        zx = 200;
        zy = 200;
      }

      let type = 'normal';
      let hp = ZOMBIE_HP;
      let speed = baseZombieSpeed;
      let w = 40;
      let h = 72;
      let color = '#4caf50';
      let canFly = false;
      let damage = ZOMBIE_DAMAGE;

      if (killCount >= STRONG_ZOMBIE_KILLS_REQUIRED) {
        const rand = Math.random() * 100;
        if (rand < 2) {
          type = 'giant';
          hp = 20;
          speed = baseZombieSpeed * 0.5;
          w = 60;
          h = 100;
          color = '#4caf50';
          damage = 100;
        } else if (rand < 6) {
          type = 'ghost';
          hp = 3;
          speed = baseZombieSpeed * 1.5;
          w = 40;
          h = 72;
          color = 'rgba(255,255,255,0.5)';
          canFly = true;
          damage = ZOMBIE_DAMAGE;
        } else if (rand < 15) {
          type = 'baby';
          hp = 1;
          speed = baseZombieSpeed * 2.2;
          w = 30;
          h = 50;
          color = '#ff5252';
          damage = 25;
        }
      }

      zombies.push({
        x: zx,
        y: zy,
        w: w,
        h: h,
        hp: hp,
        speed: speed,
        dead: false,
        type: type,
        color: color,
        canFly: canFly,
        damage: damage,
        avoidanceTimer: 0,
        avoidAngle: 0
      });
    }

    function loop() {
      if (!gameActive) return;

      let inputX = 0, inputY = 0;
      if (keys.KeyA) inputX -= 1;
      if (keys.KeyD) inputX += 1;
      if (keys.KeyW) inputY -= 1;
      if (keys.KeyS) inputY += 1;

      if (inputX !== 0 || inputY !== 0) {
        const len = Math.hypot(inputX, inputY);
        inputX /= len;
        inputY /= len;
        velX += inputX * ACCELERATION;
        velY += inputY * ACCELERATION;
        const maxSpeed = SPEED;
        const currentSpeed = Math.hypot(velX, velY);
        if (currentSpeed > maxSpeed) {
          velX = (velX / currentSpeed) * maxSpeed;
          velY = (velY / currentSpeed) * maxSpeed;
        }
        isMoving = true;
        legAnimPhase += 0.3;
      } else {
        velX *= FRICTION;
        velY *= FRICTION;
        if (Math.abs(velX) < 0.01) velX = 0;
        if (Math.abs(velY) < 0.01) velY = 0;
        isMoving = false;
        legAnimPhase *= 0.9;
      }

      // Проверяем движение по осям отдельно для избежания застревания
      let newX = x + velX;
      let newY = y + velY;

      newX = Math.max(0, Math.min(WORLD_WIDTH - S, newX));
      newY = Math.max(0, Math.min(WORLD_HEIGHT - S * 1.8, newY));

      // Проверяем отдельно по X
      const xHitbox = { x: newX, y: y, w: S, h: S * 1.8 };
      let xCanMove = !collidesWithTrees(xHitbox.x, xHitbox.y, xHitbox.w, xHitbox.h);
      
      if (xCanMove) {
        x = newX;
      } else {
        velX = 0;
      }

      // Проверяем отдельно по Y
      const yHitbox = { x: x, y: newY, w: S, h: S * 1.8 };
      let yCanMove = !collidesWithTrees(yHitbox.x, yHitbox.y, yHitbox.w, yHitbox.h);
      
      if (yCanMove) {
        y = newY;
      } else {
        velY = 0;
      }

      camera.x += (x - c.width / 2 + S / 2 - camera.x) * 0.1;
      camera.y += (y - c.height / 2 + S / 2 - camera.y) * 0.1;
      camera.x = Math.max(0, Math.min(WORLD_WIDTH - c.width, camera.x));
      camera.y = Math.max(0, Math.min(WORLD_HEIGHT - c.height, camera.y));

      const aliveZombies = zombies.filter(z => !z.dead).length;
      if (aliveZombies < maxZombies) {
        spawnZombie();
      }

      zombieAnimPhase += 0.08;

      for (const z of zombies) {
        if (z.dead) continue;

        const targetX = x + S / 2;
        const targetY = y + S * 0.9;
        const centerZx = z.x + z.w / 2;
        const centerZy = z.y + z.h / 2;

        let dx = targetX - centerZx;
        let dy = targetY - centerZy;
        let len = Math.hypot(dx, dy);

        if (len > 0) {
          let moveX = (dx / len) * z.speed;
          let moveY = (dy / len) * z.speed;

          if (!z.canFly) {
            const nextX = z.x + moveX;
            const nextY = z.y + moveY;

            if (collidesWithTrees(nextX, nextY, z.w, z.h)) {
              if (z.avoidanceTimer <= 0) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const perpX = -dy / len * side;
                const perpY = dx / len * side;
                z.avoidAngle = Math.atan2(perpY + (dy / len) * 0.5, perpX + (dx / len) * 0.5);
                z.avoidanceTimer = 30 + Math.floor(Math.random() * 30);
              }
              if (z.avoidanceTimer > 0) {
                moveX = Math.cos(z.avoidAngle) * z.speed * 2.5;
                moveY = Math.sin(z.avoidAngle) * z.speed * 2.5;
                z.avoidanceTimer--;
              } else {
                moveX *= 0.3;
                moveY *= 0.3;
              }
            } else {
              z.avoidanceTimer = 0;
            }

            const nextZx = z.x + moveX;
            const nextZy = z.y + moveY;

            let moved = false;
            if (!collidesWithTrees(nextZx, z.y, z.w, z.h) && !collidesWithOtherZombies(z, nextZx, z.y, z.w, z.h)) {
              z.x = nextZx;
              moved = true;
            }
            if (!collidesWithTrees(z.x, nextZy, z.w, z.h) && !collidesWithOtherZombies(z, z.x, nextZy, z.w, z.h)) {
              z.y = nextZy;
              moved = true;
            }
            if (!moved) {
              const avoidX = z.x + Math.cos(z.avoidAngle) * 1.5;
              const avoidY = z.y + Math.sin(z.avoidAngle) * 1.5;
              if (!collidesWithTrees(avoidX, avoidY, z.w, z.h) && !collidesWithOtherZombies(z, avoidX, avoidY, z.w, z.h)) {
                z.x = avoidX;
                z.y = avoidY;
              }
            }
          } else {
            z.x += moveX;
            z.y += moveY;
          }
        }
      }

      const now = Date.now();
      if (now - lastHitTime > HIT_COOLDOWN) {
        const playerRect = { x: x, y: y, w: S, h: S * 1.8 };
        for (const z of zombies) {
          if (z.dead) continue;
          const zRect = { x: z.x, y: z.y, w: z.w, h: z.h };
          if (rectCollide(playerRect, zRect)) {
            playerHp -= z.damage;
            updateHpDisplay();
            lastHitTime = now;
            if (playerHp <= 0) {
              gameOver();
              return;
            }
            break;
          }
        }
      }

      function shootPistol(dx, dy) {
        const key = dx + ',' + dy;
        if (now - (lastShot[key] || 0) >= FIRE_RATE_PISTOL) {
          bullets.push({
            x: x + S/2 + dx * 20,
            y: y + S/2 + dy * 20,
            dx: dx * BULLET_SPEED,
            dy: dy * BULLET_SPEED,
            damage: 1,
            isShotgun: false
          });
          lastShot[key] = now;
          gunDirection = { dx, dy };
        }
      }

      function shootShotgun(dx, dy) {
        const key = dx + ',' + dy;
        if (now - (lastShot[key] || 0) >= FIRE_RATE_SHOTGUN) {
          for (let i = -2; i <= 2; i++) {
            const angle = Math.atan2(dy, dx) + (i * 0.15);
            const spreadDx = Math.cos(angle);
            const spreadDy = Math.sin(angle);
            bullets.push({
              x: x + S/2 + dx * 20,
              y: y + S/2 + dy * 20,
              dx: spreadDx * BULLET_SPEED * (1 + Math.abs(i)*0.1),
              dy: spreadDy * BULLET_SPEED * (1 + Math.abs(i)*0.1),
              damage: 3,
              isShotgun: true
            });
          }
          lastShot[key] = now;
          gunDirection = { dx, dy };
        }
      }

      if (currentWeapon === 'shotgun') {
        if (keys.ArrowUp) shootShotgun(0, -1);
        if (keys.ArrowDown) shootShotgun(0, 1);
        if (keys.ArrowLeft) shootShotgun(-1, 0);
        if (keys.ArrowRight) shootShotgun(1, 0);
      } else {
        if (keys.ArrowUp) shootPistol(0, -1);
        if (keys.ArrowDown) shootPistol(0, 1);
        if (keys.ArrowLeft) shootPistol(-1, 0);
        if (keys.ArrowRight) shootPistol(1, 0);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx;
        b.y += b.dy;

        const bulletRect = { x: b.x - 4, y: b.y - 4, w: 8, h: 8 };
        let hitTree = false;
        for (const t of trees) {
          if (rectCollide(bulletRect, t)) {
            hitTree = true;
            break;
          }
        }

        if (hitTree) {
          bullets.splice(i, 1);
          continue;
        }

        let hitZombie = false;
        for (const z of zombies) {
          if (z.dead) continue;
          const zRect = { x: z.x, y: z.y, w: z.w, h: z.h };
          if (rectCollide(bulletRect, zRect)) {
            hitZombie = true;
            z.hp -= b.damage;
            if (z.hp <= 0) {
              z.dead = true;
              killCount++;
              spawnParticles(z.x + z.w/2, z.y + z.h/2);
              updateKillCounterDisplay();
              if (killCount % 10 === 0 && killCount > 0) {
                baseZombieSpeed += 0.15;
              }
              if (killCount % KILLS_PER_LEVEL === 0 && killCount > 0) {
                currentWave = Math.floor(killCount / KILLS_PER_LEVEL) + 1;
                maxZombies = Math.min(25, maxZombies + 2);
              }
              if (killCount >= SHOTGUN_KILLS_REQUIRED && currentWeapon !== 'shotgun') {
                currentWeapon = 'shotgun';
                updateKillCounterDisplay();
              }
            }
            break;
          }
        }

        if (hitZombie || b.x < 0 || b.x > WORLD_WIDTH || b.y < 0 || b.y > WORLD_HEIGHT) {
          bullets.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life--;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#3cb043';
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      ctx.fillStyle = '#4cbb17';
      ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      for (const t of trees) {
        const trunkW = 24;
        const trunkH = 36;
        const trunkX = t.x + (t.w - trunkW) / 2;
        const trunkY = t.y + 20;

        ctx.fillStyle = '#5d4037';
        ctx.fillRect(trunkX, trunkY, trunkW, trunkH);

        const crownX = t.x + t.w / 2;
        const crownY = t.y + 18;
        const crownR = 26;

        ctx.fillStyle = '#2e7d32';
        ctx.beginPath();
        ctx.arc(crownX, crownY, crownR, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const z of zombies) {
        if (z.dead) continue;
        
        const bobY = Math.sin(zombieAnimPhase + z.x * 0.1) * 3;
        const armWave = Math.sin(zombieAnimPhase * 2 + z.x * 0.1) * 5;
        const legWave = Math.cos(zombieAnimPhase * 2 + z.x * 0.1) * 5;
        
        ctx.fillStyle = z.color;
        
        if (z.type === 'ghost') {
          ctx.globalAlpha = 0.6;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(z.x, z.y + bobY, z.w, z.h * 0.7);
          ctx.beginPath();
          ctx.arc(z.x + z.w/2, z.y - 10 + bobY, z.w * 0.35, 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
        } else if (z.type === 'baby') {
          ctx.fillStyle = '#ff5252';
          ctx.fillRect(z.x, z.y + bobY, z.w, z.h * 0.7);
          ctx.beginPath();
          ctx.arc(z.x + z.w/2, z.y - 10 + bobY, z.w * 0.35, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#d32f2f';
          ctx.fillRect(z.x + 3 + armWave, z.y + z.h*0.7 + bobY, z.w * 0.3, z.h * 0.3);
          ctx.fillRect(z.x + z.w - 10 - armWave, z.y + z.h*0.7 + bobY, z.w * 0.3, z.h * 0.3);
        } else if (z.type === 'giant') {
          ctx.fillStyle = '#4caf50';
          ctx.fillRect(z.x, z.y + bobY, z.w, z.h * 0.7);
          ctx.beginPath();
          ctx.arc(z.x + z.w/2, z.y - 15 + bobY, z.w * 0.4, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#2e7d32';
          ctx.fillRect(z.x + 10 + legWave, z.y + z.h*0.7 + bobY, z.w * 0.3, z.h * 0.3);
          ctx.fillRect(z.x + z.w - 20 - legWave, z.y + z.h*0.7 + bobY, z.w * 0.3, z.h * 0.3);
        } else {
          ctx.fillStyle = '#4caf50';
          ctx.fillRect(z.x, z.y + bobY, z.w, z.h * 0.7);
          ctx.fillStyle = '#388e3c';
          ctx.beginPath();
          ctx.arc(z.x + z.w/2, z.y - 10 + bobY, z.w * 0.35, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#2e7d32';
          ctx.fillRect(z.x + 5 + armWave, z.y + z.h*0.7 + bobY, z.w * 0.3, z.h * 0.3);
          ctx.fillRect(z.x + z.w - 15 - armWave, z.y + z.h*0.7 + bobY, z.w * 0.3, z.h * 0.3);
        }
      }

      for (const p of particles) {
        ctx.globalAlpha = p.life / 60;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        ctx.globalAlpha = 1.0;
      }

      ctx.fillStyle = '#ffaa00';
      for (const b of bullets) {
        ctx.fillRect(b.x - 4, b.y - 4, 8, 8);
      }

      const centerX = x + S / 2;
      const centerY = y + S / 2;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, S, S * 0.9);

      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); 
      ctx.arc(centerX, y - 10, S * 0.35, 0, Math.PI*2); 
      ctx.fill();

      const legOffset = Math.sin(legAnimPhase) * 12;
      ctx.fillStyle = '#444444';
      ctx.fillRect(x + 5, y + S*0.9 + (isMoving ? legOffset : 0), S * 0.3, S * 0.5);
      ctx.fillRect(x + S - 15, y + S*0.9 + (isMoving ? -legOffset : 0), S * 0.3, S * 0.5);

      const gunLength = currentWeapon === 'shotgun' ? 32 : 22;
      const gunWidth = currentWeapon === 'shotgun' ? 12 : 8;
      
      const shoulderX = centerX + gunDirection.dx * 18;
      const shoulderY = y + S * 0.45 + gunDirection.dy * 18;

      const endX = shoulderX + gunDirection.dx * gunLength;
      const endY = shoulderY + gunDirection.dy * gunLength;

      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(centerX + gunDirection.dx * 5, y + S * 0.45 + gunDirection.dy * 5);
      ctx.lineTo(shoulderX, shoulderY);
      ctx.stroke();

      ctx.strokeStyle = '#2c2c2c';
      ctx.lineWidth = gunWidth;
      ctx.beginPath();
      ctx.moveTo(shoulderX, shoulderY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      ctx.fillStyle = '#666';
      ctx.fillRect(shoulderX - 8, shoulderY - 6, 6, 4);

      ctx.save();
      ctx.translate(shoulderX, shoulderY);
      ctx.rotate(Math.atan2(gunDirection.dy, gunDirection.dx) + Math.PI / 2);
      ctx.fillStyle = '#444';
      ctx.fillRect(-6, -4, 12, 10);
      ctx.restore();

      ctx.restore();

      requestAnimationFrame(loop);
    }

    function gameOver() {
      gameActive = false;
      goScreen.style.display = 'flex';
    }

    goScreen.addEventListener('click', initGame);

    c.onclick = () => {
      if (!gameActive) initGame();
    };
  </script>
</body>
